name: Lesson 14 WebSocket check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci-bootstrap-only
      DATABASE_URL: postgres://libratrack:ci-app-only@localhost:5432/libratrack14?sslmode=disable
      TEST_DATABASE_URL: postgres://libratrack:ci-app-only@localhost:5432/libratrack14_test?sslmode=disable
      JWT_SECRET: ci-ephemeral-signing-secret-not-for-deployment
      POSTGRES_PASSWORD: ci-compose-validation-only
      APP_DB_PASSWORD: ci-compose-validation-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create isolated databases
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE libratrack LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-app-only';
          CREATE DATABASE libratrack14 OWNER libratrack;
          CREATE DATABASE libratrack14_test OWNER libratrack;
          SQL
      - name: Build vet and race tests
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/lesson14-evidence
        run: |
          bash scripts/check.sh
          docker compose config -q
          test -z "$(git ls-files .env '*.log' '*.png' '*.docx')"
          cat "$ARTIFACTS_DIR/test-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson14-tests
          path: ${{ runner.temp }}/lesson14-evidence/
          if-no-files-found: ignore
